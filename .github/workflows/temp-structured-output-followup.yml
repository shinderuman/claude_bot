name: Temporary structured output follow-up check

on:
  push:
    branches:
      - fix/structured-output-retry-boundary

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          changed=$(git diff --name-only 8a5f244ca440eb9342cf7743006432fddb4b5ff9..HEAD -- '*.go')
          unformatted=$(printf '%s\n' "$changed" | sed '/^$/d' | xargs -r gofmt -l)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - run: go vet ./internal/llm/...
      - run: go test ./internal/llm/...
      - run: go test -race ./internal/llm/...
      - run: go test ./...
