name: Temporary structured output check

on:
  push:
    branches:
      - feat/structured-tool-output

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gofmt
        shell: bash
        run: |
          changed=$(git diff --name-only b63269931a83590256d215df63aa09034e2242f8..HEAD -- '*.go')
          unformatted=$(printf '%s\n' "$changed" | sed '/^$/d' | xargs -r gofmt -l)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - run: go vet ./internal/llm/...
      - run: go test ./internal/llm/...
      - run: go test -race ./internal/llm/...
      - run: go test ./...
